<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPanel — система управления образовательным процессом</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <header class="header">
      <h1 class="header__logo">EduPanel</h1>
      <p class="header__tagline">Система управления образовательным процессом</p>
    </header>

    <nav class="sidebar" aria-label="Основная навигация">
      <ul class="nav" role="list">
        <li><a href="#" class="nav__link nav__link--active" data-section="courses">Курсы</a></li>
        <li><a href="#" class="nav__link" data-section="students">Студенты</a></li>
        <li><a href="#" class="nav__link" data-section="assignments">Задания</a></li>
      </ul>
    </nav>

    <main id="main-content" class="main"></main>

    <footer class="footer">
      <p>© 2026 EduPanel · Учебный проект LMS</p>
      <address>Поддержка: support@edupanel.local</address>
    </footer>
  </div>

  <div id="detail-modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
      <header class="modal__header">
        <h2 id="detail-modal-title" class="modal__title">Детали</h2>
        <button type="button" class="modal__close" id="detail-modal-close" aria-label="Закрыть">×</button>
      </header>
      <div class="modal__body" id="detail-modal-body"></div>
      <footer class="modal__footer">
        <button type="button" class="btn btn--secondary" id="detail-modal-ok">Закрыть</button>
      </footer>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
